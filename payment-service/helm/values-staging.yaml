namespace: staging

app:
  name: payment-service

image:
  repository: shubhamnavale8177/payment-service
  tag: v1
  pullPolicy: Always

replicaCount: 2

containerPort: 8080

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  host: payment.staging.local
  path: /api/payments

resources:
  requests:
    cpu: 50m
    memory: 64Mi

  limits:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 60