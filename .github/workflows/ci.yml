name: CI Pipeline

on:
push:
branches:
- main
- master

pull_request:
branches:
- main
- master

jobs:
build-and-push:
runs-on: ubuntu-latest


strategy:
  matrix:
    service:
      - user-service
      - order-service
      - payment-service

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Build Maven Project
    working-directory: ${{ matrix.service }}
    run: mvn clean package -DskipTests

  - name: Login to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  - name: Build Docker Image
    working-directory: ${{ matrix.service }}
    run: |
      docker build \
        -t shubhamnavale8177/${{ matrix.service }}:latest \
        -t shubhamnavale8177/${{ matrix.service }}:${{ github.run_number }} .

  - name: Push Docker Image
    run: |
      docker push shubhamnavale8177/${{ matrix.service }}:latest
      docker push shubhamnavale8177/${{ matrix.service }}:${{ github.run_number }}

